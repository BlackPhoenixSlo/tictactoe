<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f4f4f8;
    color: #222;
  }
  h1 { margin: 0 0 12px; font-size: 2rem; }
  #status {
    min-height: 1.6em;
    margin-bottom: 16px;
    font-size: 1.2rem;
    font-weight: 600;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-template-rows: repeat(3, 100px);
    gap: 6px;
  }
  .cell {
    background: #fff;
    border: 2px solid #ccc;
    border-radius: 8px;
    font-size: 3rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  .cell:hover:not(:disabled) { background: #eef; }
  .cell:disabled { cursor: default; }
  .cell.x { color: #d33; }
  .cell.o { color: #36c; }
  .cell.win { background: #d9f7d9; border-color: #4caf50; }
  #reset {
    margin-top: 20px;
    padding: 10px 24px;
    font-size: 1rem;
    border: none;
    border-radius: 6px;
    background: #333;
    color: #fff;
    cursor: pointer;
  }
  #reset:hover { background: #555; }
</style>
</head>
<body>
  <h1>Tic-Tac-Toe</h1>
  <div id="status" aria-live="polite"></div>
  <div id="board"></div>
  <button id="reset">Reset</button>

<script>
  const WINS = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const resetBtn = document.getElementById('reset');

  let board, current, gameOver;
  const cells = [];

  for (let i = 0; i < 9; i++) {
    const btn = document.createElement('button');
    btn.className = 'cell';
    btn.dataset.index = i;
    btn.setAttribute('aria-label', 'Cell ' + (i + 1));
    btn.addEventListener('click', () => play(i));
    boardEl.appendChild(btn);
    cells.push(btn);
  }

  function init() {
    board = Array(9).fill(null);
    current = 'X';
    gameOver = false;
    cells.forEach(c => {
      c.textContent = '';
      c.className = 'cell';
      c.disabled = false;
    });
    statusEl.textContent = `Player ${current}'s turn`;
  }

  function play(i) {
    if (gameOver || board[i]) return;
    board[i] = current;
    cells[i].textContent = current;
    cells[i].classList.add(current.toLowerCase());
    cells[i].disabled = true;

    const line = WINS.find(([a,b,c]) => board[a] && board[a] === board[b] && board[a] === board[c]);
    if (line) {
      gameOver = true;
      line.forEach(idx => cells[idx].classList.add('win'));
      statusEl.textContent = `Player ${current} wins!`;
      cells.forEach(c => c.disabled = true);
      return;
    }
    if (board.every(Boolean)) {
      gameOver = true;
      statusEl.textContent = "It's a draw!";
      return;
    }
    current = current === 'X' ? 'O' : 'X';
    statusEl.textContent = `Player ${current}'s turn`;
  }

  resetBtn.addEventListener('click', init);
  init();
</script>
</body>
</html>
